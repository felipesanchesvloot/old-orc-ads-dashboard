<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Orc · Ads Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e8eef5;
    --muted: #8b9bb4;
    --meta: #1877f2;
    --google: #34a853;
    --accent: #ff6b35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { margin: 0 0 8px; font-size: 1.8rem; }
  .subtitle { color: var(--muted); margin-bottom: 24px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .card .label { color: var(--muted); font-size: 0.85rem; }
  .card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .card.meta .value { color: var(--meta); }
  .card.google .value { color: var(--google); }
  .card.total .value { color: var(--accent); }
  .chart-wrap {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  canvas { max-height: 380px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
  }
  th, td { padding: 10px 12px; text-align: right; }
  th { background: #243044; font-weight: 600; text-align: right; }
  td:first-child, th:first-child { text-align: left; }
  tr:nth-child(even) { background: #1e2a3d; }
  .footer { margin-top: 32px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
  <h1>Old Orc · Ads Dashboard</h1>
  <div class="subtitle">Outubro 2026 · Meta Ads + Google Ads · valores em R$</div>

  <div class="cards" id="cards"></div>

  <div class="chart-wrap">
    <canvas id="spendChart"></canvas>
  </div>

  <div class="chart-wrap">
    <canvas id="roasChart"></canvas>
  </div>

  <table id="table">
    <thead>
      <tr>
        <th>Data</th>
        <th>Meta</th>
        <th>Google</th>
        <th>Total</th>
        <th>Meta ROAS</th>
        <th>Google ROAS</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="footer">
    Dados via Zernio · Atualizado em 31/10/2026 · Snapshot estático
  </div>
