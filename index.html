<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O.O · Ads Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --card: #1a2332;
    --text: #e8eef5;
    --muted: #8b9bb4;
    --meta: #1877f2;
    --google: #34a853;
    --pinterest: #e60023;
    --accent: #ff6b35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { margin: 0 0 8px; font-size: 1.8rem; }
  .subtitle { color: var(--muted); margin-bottom: 20px; }
  .metric-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .metric-btns button {
    background: var(--card);
    color: var(--text);
    border: 1px solid #2a3548;
    border-radius: 8px;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .metric-btns button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .view-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .view-btns button {
    background: var(--card);
    color: var(--text);
    border: 1px solid #2a3548;
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .view-btns button.active {
    background: #2a3548;
    border-color: #4a5a78;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
    padding-left: 4px;
  }
  .filters button {
    background: transparent;
    color: var(--muted);
    border: 1px solid #2a3548;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .filters button.active {
    background: #2a3548;
    color: var(--text);
    border-color: #4a5a78;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .card .label { color: var(--muted); font-size: 0.85rem; }
  .card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .card.meta .value { color: var(--meta); }
  .card.google .value { color: var(--google); }
  .card.pinterest .value { color: var(--pinterest); }
  .card.total .value { color: var(--accent); }
  .chart-wrap {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
    height: 420px;
    position: relative;
  }
  .chart-wrap canvas {
    width: 100% !important;
    height: 100% !important;
  }
  .footer { margin-top: 32px; color: var(--muted); font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>

<div id="gate" style="position:fixed;inset:0;background:#0f1419;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#1a2332;padding:32px;border-radius:12px;text-align:center;max-width:320px;">
    <h2 style="margin:0 0 16px;">O.O</h2>
    <input id="pass" type="password" placeholder="Senha" style="width:100%;padding:10px;margin-bottom:12px;border-radius:6px;border:1px solid #2a3548;background:#0f1419;color:#e8eef5;">
    <button onclick="checkPass()" style="width:100%;padding:10px;background:#ff6b35;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:600;">Entrar</button>
    <p id="err" style="color:#ff6b35;font-size:0.85rem;margin:8px 0 0;display:none;">Senha incorreta</p>
  </div>
</div>
<script>
function checkPass() {
  const p = document.getElementById('pass').value;
  if (p === 'vloot') {  // muda a senha aqui
    document.getElementById('gate').style.display = 'none';
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
document.getElementById('pass').addEventListener('keydown', e => { if (e.key === 'Enter') checkPass(); });
</script>

  <h1>O.O · Ads Dashboard</h1>
  <div class="subtitle">Meta Ads + Google Ads · a partir de agosto/2026</div>

  <div class="metric-btns" id="metricBtns">
    <button data-metric="spend" class="active">Gasto</button>
    <button data-metric="clicks">Cliques</button>
    <button data-metric="cpc">CPC</button>
    <button data-metric="roas">ROAS</button>
    <button data-metric="cpa">Custo por venda</button>
    <button data-metric="custoBruto">Custo Bruto</button>
  </div>

  <div class="view-btns" id="viewBtns">
    <button data-view="daily" class="active">Diário</button>
    <button data-view="monthly">Mensal</button>
  </div>

  <div class="filters" id="filters">
    <button data-month="all" class="active">Todos</button>
    <button data-month="08">Agosto</button>
    <button data-month="09">Setembro</button>
    <button data-month="10">Outubro</button>
  </div>

  <div class="cards" id="cards"></div>

  <div class="chart-wrap">
    <canvas id="chart"></canvas>
  </div>

  <div class="footer">
    Dados via Zernio · Agosto a Outubro 2026<br>
    ROAS = receita / gasto · Custo por venda = gasto / conversões
  </div>

      const metaClicks = days.reduce((s, d) => s + (metaMap[d]?.clicks || 0), 0);
      const googleSpend = days.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
      const googleClicks = days.reduce((s, d) => s + (googleMap[d]?.clicks || 0), 0);
      const pinSpend = days.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
      const pinClicks = days.reduce((s, d) => s + (pinterestMap[d]?.clicks || 0), 0);
      return {
        label: monthNames[ym.slice(5)] || ym,
        meta: calcCPC(metaSpend, metaClicks),
        google: calcCPC(googleSpend, googleClicks),
        pinterest: calcCPC(pinSpend, pinClicks),
        metaSales: days.reduce((s, d) => s + (metaMap[d]?.purchaseValue || 0), 0),
        googleSales: days.reduce((s, d) => s + (googleMap[d]?.purchaseValue || 0), 0),
        pinSales: days.reduce((s, d) => s + (pinterestMap[d]?.purchaseValue || 0), 0)
      };
    } else if (metric === 'roas') {
      const metaSpend = days.reduce((s, d) => s + (metaMap[d]?.spend || 0), 0);
      const metaPV = days.reduce((s, d) => s + (metaMap[d]?.purchaseValue || 0), 0);
      const googleSpend = days.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
      const googlePV = days.reduce((s, d) => s + (googleMap[d]?.purchaseValue || 0), 0);
      const pinSpend = days.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
      const pinPV = days.reduce((s, d) => s + (pinterestMap[d]?.purchaseValue || 0), 0);
      return {
        label: monthNames[ym.slice(5)] || ym,
        meta: calcROAS(metaPV, metaSpend),
        google: calcROAS(googlePV, googleSpend),
        pinterest: calcROAS(pinPV, pinSpend),
        metaSales: days.reduce((s, d) => s + (metaMap[d]?.purchaseValue || 0), 0),
        googleSales: days.reduce((s, d) => s + (googleMap[d]?.purchaseValue || 0), 0),
        pinSales: days.reduce((s, d) => s + (pinterestMap[d]?.purchaseValue || 0), 0)
      };
    } else if (metric === 'cpa') {
      const metaSpend = days.reduce((s, d) => s + (metaMap[d]?.spend || 0), 0);
      const metaConv = days.reduce((s, d) => s + (metaMap[d]?.conversions || 0), 0);
      const googleSpend = days.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
      const googleConv = days.reduce((s, d) => s + (googleMap[d]?.conversions || 0), 0);
      const pinSpend = days.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
      const pinConv = days.reduce((s, d) => s + (pinterestMap[d]?.conversions || 0), 0);
      return {
        label: monthNames[ym.slice(5)] || ym,
        meta: calcCPA(metaSpend, metaConv),
        google: calcCPA(googleSpend, googleConv),
        pinterest: calcCPA(pinSpend, pinConv),
        metaSales: days.reduce((s, d) => s + (metaMap[d]?.purchaseValue || 0), 0),
        googleSales: days.reduce((s, d) => s + (googleMap[d]?.purchaseValue || 0), 0),
        pinSales: days.reduce((s, d) => s + (pinterestMap[d]?.purchaseValue || 0), 0)
      };
    } else {
      const meta = days.reduce((s, d) => s + getValue(metaMap[d], metric), 0);
      const google = days.reduce((s, d) => s + getValue(googleMap[d], metric), 0);
      const pinterest = days.reduce((s, d) => s + getValue(pinterestMap[d], metric), 0);
      const metaSales = days.reduce((s, d) => s + (metaMap[d]?.purchaseValue || 0), 0);
      const googleSales = days.reduce((s, d) => s + (googleMap[d]?.purchaseValue || 0), 0);
      const pinSales = days.reduce((s, d) => s + (pinterestMap[d]?.purchaseValue || 0), 0);
      const metaSpend = days.reduce((s, d) => s + (metaMap[d]?.spend || 0), 0);
      const googleSpend = days.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
      const pinSpend = days.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
      return { label: monthNames[ym.slice(5)] || ym, meta, google, pinterest, metaSales, googleSales, pinSales, metaSpend, googleSpend, pinSpend };
    }
  });
}

function formatValue(v, metric) {
  if (metric === 'spend' || metric === 'cpc' || metric === 'cpa') {
    return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  if (metric === 'roas' || metric === 'custoBruto') {
    return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + 'x';
  }
  return v.toLocaleString('pt-BR');
}

function updateCards(dates) {
  let metaVal, googleVal, pinVal, totalVal;
  if (currentMetric === 'cpc') {
    const metaSpend = dates.reduce((s, d) => s + (metaMap[d]?.spend || 0), 0);
    const metaClicks = dates.reduce((s, d) => s + (metaMap[d]?.clicks || 0), 0);
    const googleSpend = dates.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
    const googleClicks = dates.reduce((s, d) => s + (googleMap[d]?.clicks || 0), 0);
    const pinSpend = dates.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
    const pinClicks = dates.reduce((s, d) => s + (pinterestMap[d]?.clicks || 0), 0);
    metaVal = calcCPC(metaSpend, metaClicks);
    googleVal = calcCPC(googleSpend, googleClicks);
    pinVal = calcCPC(pinSpend, pinClicks);
    totalVal = calcCPC(metaSpend + googleSpend + pinSpend, metaClicks + googleClicks + pinClicks);
  } else if (currentMetric === 'roas') {
    const metaSpend = dates.reduce((s, d) => s + (metaMap[d]?.spend || 0), 0);
    const metaPV = dates.reduce((s, d) => s + (metaMap[d]?.purchaseValue || 0), 0);
    const googleSpend = dates.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
    const googlePV = dates.reduce((s, d) => s + (googleMap[d]?.purchaseValue || 0), 0);
    const pinSpend = dates.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
    const pinPV = dates.reduce((s, d) => s + (pinterestMap[d]?.purchaseValue || 0), 0);
    metaVal = calcROAS(metaPV, metaSpend);
    googleVal = calcROAS(googlePV, googleSpend);
    pinVal = calcROAS(pinPV, pinSpend);
    totalVal = calcROAS(metaPV + googlePV + pinPV, metaSpend + googleSpend + pinSpend);
  } else if (currentMetric === 'cpa') {
    const metaSpend = dates.reduce((s, d) => s + (metaMap[d]?.spend || 0), 0);
    const metaConv = dates.reduce((s, d) => s + (metaMap[d]?.conversions || 0), 0);
    const googleSpend = dates.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
    const googleConv = dates.reduce((s, d) => s + (googleMap[d]?.conversions || 0), 0);
    const pinSpend = dates.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
    const pinConv = dates.reduce((s, d) => s + (pinterestMap[d]?.conversions || 0), 0);
    metaVal = calcCPA(metaSpend, metaConv);
    googleVal = calcCPA(googleSpend, googleConv);
    pinVal = calcCPA(pinSpend, pinConv);
    totalVal = calcCPA(metaSpend + googleSpend + pinSpend, metaConv + googleConv + pinConv);
  } else if (currentMetric === 'custoBruto') {
    const metaSpend = dates.reduce((s, d) => s + (metaMap[d]?.spend || 0), 0);
    const googleSpend = dates.reduce((s, d) => s + (googleMap[d]?.spend || 0), 0);
    const pinSpend = dates.reduce((s, d) => s + (pinterestMap[d]?.spend || 0), 0);
    const metaSales = dates.reduce((s, d) => s + (metaMap[d]?.purchaseValue || 0), 0);
    const googleSales = dates.reduce((s, d) => s + (googleMap[d]?.purchaseValue || 0), 0);
    const pinSales = dates.reduce((s, d) => s + (pinterestMap[d]?.purchaseValue || 0), 0);
    metaVal = metaSpend > 0 ? metaSales / metaSpend : 0;
    googleVal = googleSpend > 0 ? googleSales / googleSpend : 0;
    pinVal = pinSpend > 0 ? pinSales / pinSpend : 0;
    const totalSpend = metaSpend + googleSpend + pinSpend;
    const totalSales = metaSales + googleSales + pinSales;
    totalVal = totalSpend > 0 ? totalSales / totalSpend : 0;
  } else {
    metaVal = dates.reduce((s, d) => s + getValue(metaMap[d], currentMetric), 0);
    googleVal = dates.reduce((s, d) => s + getValue(googleMap[d], currentMetric), 0);
    pinVal = dates.reduce((s, d) => s + getValue(pinterestMap[d], currentMetric), 0);
    totalVal = metaVal + googleVal + pinVal;
  }
  document.getElementById('cards').innerHTML = `
    <div class="card meta"><div class="label">Meta Ads</div><div class="value">${formatValue(metaVal, currentMetric)}</div></div>
    <div class="card google"><div class="label">Google Ads</div><div class="value">${formatValue(googleVal, currentMetric)}</div></div>
    <div class="card pinterest"><div class="label">Pinterest Ads</div><div class="value">${formatValue(pinVal, currentMetric)}</div></div>
    <div class="card total"><div class="label">Total</div><div class="value">${formatValue(totalVal, currentMetric)}</div></div>
  `;
}

function updateChart(dates) {
  const titles = {
    spend: { daily: 'Gasto diário (R$)', monthly: 'Gasto mensal (R$)' },
    clicks: { daily: 'Cliques diários', monthly: 'Cliques mensais' },
    cpc: { daily: 'CPC diário (R$)', monthly: 'CPC mensal (R$)' },
    roas: { daily: 'ROAS diário', monthly: 'ROAS mensal' },
    cpa: { daily: 'Custo por venda diário (R$)', monthly: 'Custo por venda mensal (R$)' },
    custoBruto: { daily: 'Custo Bruto diário (vendas ÷ gasto)', monthly: 'Custo Bruto mensal (vendas ÷ gasto)' }
  };

  const commonOptions = {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { labels: { color: '#e8eef5' } },
      tooltip: { mode: 'index', intersect: false }
    },
    scales: {
      x: { ticks: { color: '#8b9bb4' }, grid: { color: '#2a3548' } },
      y: { ticks: { color: '#8b9bb4' }, grid: { color: '#2a3548' } }
    }
  };

  if (currentMetric === 'spend' || currentMetric === 'cpc' || currentMetric === 'cpa') {
    commonOptions.scales.y.ticks.callback = v => 'R$ ' + (currentMetric === 'spend' ? v : v.toFixed(2));
  } else if (currentMetric === 'roas') {
    commonOptions.scales.y.ticks.callback = v => v.toFixed(1) + 'x';
  }

  if (chart) chart.destroy();

  if (currentView === 'daily') {
    const labels = dates.map(d => d.slice(5));
    let datasets;
    if (currentMetric === 'custoBruto') {
      const combined = dates.map(d => {
        const spend = (metaMap[d]?.spend || 0) + (googleMap[d]?.spend || 0) + (pinterestMap[d]?.spend || 0);
        const sales = (metaMap[d]?.purchaseValue || 0) + (googleMap[d]?.purchaseValue || 0) + (pinterestMap[d]?.purchaseValue || 0);
        return spend > 0 ? sales / spend : 0;
      });
      datasets = [
        { label: 'Custo Bruto (3 plataformas)', data: combined, borderColor: '#fbbf24', backgroundColor: 'rgba(251,191,36,0.15)', tension: 0.3, fill: true, pointRadius: 3, pointHoverRadius: 6 }
      ];
    } else {
      const metaData = dates.map(d => getValue(metaMap[d], currentMetric));
      const googleData = dates.map(d => getValue(googleMap[d], currentMetric));
      const pinterestData = dates.map(d => getValue(pinterestMap[d], currentMetric));
      datasets = [
        { label: 'Meta Ads', data: metaData, borderColor: '#1877f2', backgroundColor: 'rgba(24,119,242,0.1)', tension: 0.3, fill: true, pointRadius: 3, pointHoverRadius: 6 },
        { label: 'Google Ads', data: googleData, borderColor: '#34a853', backgroundColor: 'rgba(52,168,83,0.1)', tension: 0.3, fill: true, pointRadius: 3, pointHoverRadius: 6 },
        { label: 'Pinterest Ads', data: pinterestData, borderColor: '#e60023', backgroundColor: 'rgba(230,0,35,0.1)', tension: 0.3, fill: true, pointRadius: 3, pointHoverRadius: 6 }
      ];
    }

    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels,
        datasets
      },
      options: {
        ...commonOptions,
        plugins: {
          ...commonOptions.plugins,
          title: { display: true, text: titles[currentMetric].daily, color: '#e8eef5', font: { size: 16 } }
        }
      }
    });
  } else {
    const monthly = getMonthlyData(dates, currentMetric);
    const labels = monthly.map(m => m.label);
    let datasets;
    if (currentMetric === 'custoBruto') {
      const combined = monthly.map(m => {
        const spend = (m.metaSpend || 0) + (m.googleSpend || 0) + (m.pinSpend || 0);
        const sales = (m.metaSales || 0) + (m.googleSales || 0) + (m.pinSales || 0);
        return spend > 0 ? sales / spend : 0;
      });
      datasets = [
        { label: 'Custo Bruto (3 plataformas)', data: combined, backgroundColor: 'rgba(251,191,36,0.7)' }
      ];
    } else {
      const metaData = monthly.map(m => m.meta);
      const googleData = monthly.map(m => m.google);
      const pinterestData = monthly.map(m => m.pinterest);
      datasets = [
        { label: 'Meta Ads', data: metaData, backgroundColor: 'rgba(24,119,242,0.7)' },
        { label: 'Google Ads', data: googleData, backgroundColor: 'rgba(52,168,83,0.7)' },
        { label: 'Pinterest Ads', data: pinterestData, backgroundColor: 'rgba(230,0,35,0.7)' }
      ];
    }

    chart = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: {
        labels,
        datasets
      },
      options: {
        ...commonOptions,
        plugins: {
          ...commonOptions.plugins,
          title: { display: true, text: titles[currentMetric].monthly, color: '#e8eef5', font: { size: 16 } }
        }
      }
    });
  }
}

function render() {
  document.querySelectorAll('#metricBtns button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.metric === currentMetric);
  });
  document.querySelectorAll('#viewBtns button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view === currentView);
  });
  document.querySelectorAll('#filters button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.month === currentMonth);
  });
  const dates = getFilteredDates();
  updateCards(dates);
  updateChart(dates);
}

document.getElementById('metricBtns').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') {
    currentMetric = e.target.dataset.metric;
    render();
  }
});

document.getElementById('viewBtns').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') {
    currentView = e.target.dataset.view;
    render();
  }
});

document.getElementById('filters').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON') {
    currentMonth = e.target.dataset.month;
    render();
  }
});

render();
</script>
