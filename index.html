<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Orc · Ads Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<style>
  :root { --bg:#0f1419; --card:#1a2332; --text:#e8eef5; --muted:#8b9bb4; --meta:#1877f2; --google:#34a853; --accent:#ff6b35; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  h1 { margin:0 0 8px; font-size:1.8rem; }
  .subtitle { color:var(--muted); margin-bottom:24px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .card { background:var(--card); border-radius:12px; padding:16px 20px; }
  .card .label { color:var(--muted); font-size:0.85rem; }
  .card .value { font-size:1.6rem; font-weight:700; margin-top:4px; }
  .card.meta .value { color:var(--meta); }
  .card.google .value { color:var(--google); }
  .card.total .value { color:var(--accent); }
  .chart-wrap { background:var(--card); border-radius:12px; padding:16px; margin-bottom:24px; }
  canvas { max-height:380px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; }
  th, td { padding:10px 12px; text-align:right; }
  th { background:#243044; font-weight:600; }
  td:first-child, th:first-child { text-align:left; }
  tr:nth-child(even) { background:#1e2a3d; }
  .footer { margin-top:32px; color:var(--muted); font-size:0.8rem; text-align:center; }
</style>
</head>
<body>
  <h1>Old Orc · Ads Dashboard</h1>
  <div class="subtitle">Outubro 2026 · Meta Ads + Google Ads · valores em R$</div>
  <div class="cards" id="cards"></div>
  <div class="chart-wrap"><canvas id="spendChart"></canvas></div>
  <div class="chart-wrap"><canvas id="roasChart"></canvas></div>
  <table id="table">
    <thead><tr><th>Data</th><th>Meta</th><th>Google</th><th>Total</th><th>Meta ROAS</th><th>Google ROAS</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="footer">Dados via Zernio · Snapshot 31/10/2026</div>
<script>
const metaMap = Object.fromEntries(DATA.meta.map(r => [r.date, r]));
const googleMap = Object.fromEntries(DATA.google.map(r => [r.date, r]));
const dates = [...new Set([...DATA.meta.map(r=>r.date), ...DATA.google.map(r=>r.date)])].sort();
const metaSpend = dates.map(d => metaMap[d]?.spend || 0);
const googleSpend = dates.map(d => googleMap[d]?.spend || 0);
const metaRoas = dates.map(d => metaMap[d]?.roas || 0);
const googleRoas = dates.map(d => googleMap[d]?.roas || 0);
const metaTotal = metaSpend.reduce((a,b)=>a+b,0);
const googleTotal = googleSpend.reduce((a,b)=>a+b,0);
const grandTotal = metaTotal + googleTotal;
document.getElementById('cards').innerHTML = `
  <div class="card meta"><div class="label">Meta Ads</div><div class="value">R$ ${metaTotal.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
  <div class="card google"><div class="label">Google Ads</div><div class="value">R$ ${googleTotal.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
  <div class="card total"><div class="label">Total Outubro</div><div class="value">R$ ${grandTotal.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
`;
new Chart(document.getElementById('spendChart'), {
  type: 'line',
  data: { labels: dates.map(d=>d.slice(5)), datasets: [
    { label: 'Meta Ads', data: metaSpend, borderColor: '#1877f2', backgroundColor: 'rgba(24,119,242,0.1)', tension: 0.3, fill: true },
    { label: 'Google Ads', data: googleSpend, borderColor: '#34a853', backgroundColor: 'rgba(52,168,83,0.1)', tension: 0.3, fill: true }
  ]},
  options: { responsive: true, plugins: { legend: { labels: { color: '#e8eef5' } } }, scales: { x: { ticks: { color: '#8b9bb4' }, grid: { color: '#2a3548' } }, y: { ticks: { color: '#8b9bb4', callback: v => 'R$ '+v }, grid: { color: '#2a3548' } } } }
});
new Chart(document.getElementById('roasChart'), {
  type: 'bar',
  data: { labels: dates.map(d=>d.slice(5)), datasets: [
    { label: 'Meta ROAS', data: metaRoas, backgroundColor: 'rgba(24,119,242,0.7)' },
    { label: 'Google ROAS', data: googleRoas, backgroundColor: 'rgba(52,168,83,0.7)' }
  ]},
  options: { responsive: true, plugins: { legend: { labels: { color: '#e8eef5' } } }, scales: { x: { ticks: { color: '#8b9bb4' }, grid: { display: false } }, y: { ticks: { color: '#8b9bb4' }, grid: { color: '#2a3548' } } } }
});
const tbody = document.querySelector('#table tbody');
dates.slice().reverse().forEach(d => {
  const m = metaMap[d] || {};
  const g = googleMap[d] || {};
  const total = (m.spend||0) + (g.spend||0);
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${d.split('-').reverse().join('/')}</td><td>${(m.spend||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td>${(g.spend||0).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td><strong>${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong></td><td>${(m.roas||0).toFixed(1)}</td><td>${(g.roas||0).toFixed(1)}</td>`;
  tbody.appendChild(tr);
});
</script>
</body>
</html>
